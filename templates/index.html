<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Getsêmani</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Getsêmani Gestão</a>
    <div class="d-flex gap-2">
        <a href="/transacoes" class="btn btn-outline-light btn-sm">Lançamentos</a>
        <a href="/ministerios" class="btn btn-outline-light btn-sm">Ministérios</a>
        <a href="/logout" class="btn btn-danger btn-sm">Sair</a>
    </div>
  </div>
</nav>

<div class="container">
    <h2 class="mb-4">Painel Principal</h2>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card text-white bg-success p-3">
                <h5>Entradas</h5>
                <h3>R$ {{ "%.2f"|format(entradas) }}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-danger p-3">
                <h5>Saídas</h5>
                <h3>R$ {{ "%.2f"|format(saidas) }}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-primary p-3">
                <h5>Saldo</h5>
                <h3>R$ {{ "%.2f"|format(entradas - saidas) }}</h3>
            </div>
        </div>
    </div>
</div>

</body>
</html>
