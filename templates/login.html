<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Getsêmani System - Acesso Geral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: #111827; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #1f2937; }
        .form-control { background-color: #1f2937; border: 1px solid #374151; color: #fff; }
        .form-control:focus { background-color: #1f2937; border-color: #3b82f6; color: #fff; box-shadow: none; }
        .watermark { font-size: 11px; color: #6b7280; text-align: center; margin-top: 20px; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">GETSÊMANI SYSTEM</h3>
        <p class="text-muted small">Administração Financeira Ministerial</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-danger py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label small">Utilizador</label>
            <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-4">
            <label class="form-label small">Senha</label>
            <input type="password" class="form-control" name="senha" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary fw-bold py-2">Entrar no Sistema</button>
        </div>
    </form>
    <div class="watermark">brayan.sistemy &copy; 2026</div>
</div>
</body>
</html>
