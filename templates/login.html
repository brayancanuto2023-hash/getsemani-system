<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Getsêmani System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #1e293b; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-login { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); background: #ffffff; width: 100%; max-width: 400px; padding: 30px; }
    </style>
</head>
<body>

<div class="card card-login">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">GETSÊMANI</h3>
        <p class="text-muted small">Ecossistema de Gestão Eclesiástica</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label for="usuario" class="form-label small fw-semibold">Utilizador</label>
            <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Digite o seu utilizador" required>
        </div>

        <div class="mb-4">
            <label for="senha" class="form-label small fw-semibold">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite a sua senha" required>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary py-2 fw-bold">Entrar no Sistema</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
