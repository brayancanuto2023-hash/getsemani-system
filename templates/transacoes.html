<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançar Transação - Getsêmani System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-form { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: #ffffff; }
    </style>
</head>
<body>

<div class="container mt-5" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark mb-0"><i class="bi bi-arrow-down-up text-primary me-2"></i>Lançar Nova Movimentação</h3>
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Voltar ao Painel</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card card-form p-4">
        <form action="/transacoes" method="POST">
            
            <div class="mb-3">
                <label for="tipo_transacao" class="form-label fw-semibold">Tipo de Transação</label>
                <select class="form-select" id="tipo_transacao" name="tipo_transacao" required>
                    <option value="dizimo">Dízimo (Identificado)</option>
                    <option value="oferta">Oferta Anônima / Culto</option>
                    <option value="despesa">Despesa / Saída</option>
                    <option value="entrada">Outras Entradas</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label fw-semibold">Nome do Membro / Categoria</label>
                <input type="text" class="form-control" id="categoria" name="categoria" placeholder="Ex: João Silva ou Conta de Água" required>
            </div>

            <div class="mb-3">
                <label for="valor" class="form-label fw-semibold">Valor (R$)</label>
                <input type="number" step="0.01" class="form-control" id="valor" name="valor" placeholder="0.00" required>
            </div>

            <div class="mb-4">
                <label for="descricao" class="form-label fw-semibold">Ministério Vinculado</label>
                <input type="text" class="form-control" id="descricao" name="descricao" placeholder="Ex: Sede, Congregação Norte">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary py-2 fw-bold"><i class="bi bi-check-circle me-1"></i> Gravar Lançamento</button>
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
